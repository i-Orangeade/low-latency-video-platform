# ZLMediaKit project notes
#
# The first runnable chain uses the default config bundled in the Docker image.
# This file records the recommended settings to apply after the minimal chain is
# verified. Copy these values into the active ZLM config when enabling hooks,
# recording, or tighter latency tuning.

[api]
apiDebug=1
secret=REPLACE_WITH_LOCAL_SECRET

[protocol]
modify_stamp=2
enable_audio=1
add_mute_audio=1
auto_close=0
continue_push_ms=15000
enable_hls=1
enable_mp4=0
enable_rtsp=1
enable_rtmp=1
enable_ts=1
enable_fmp4=1
hls_demand=0
rtmp_demand=0
fmp4_demand=0

[general]
enableVhost=0
maxStreamWaitMS=15000
mergeWriteMS=0
mediaServerId=drone_zlm_001

[hls]
segDur=2
segNum=3
segRetain=5

[hook]
enable=1
admin_params=secret=REPLACE_WITH_LOCAL_SECRET
on_publish=http://backend:8000/api/zlm/hooks/on_publish
on_stream_changed=http://backend:8000/api/zlm/hooks/on_stream_changed
on_record_mp4=http://backend:8000/api/zlm/hooks/on_record_mp4
on_flow_report=http://backend:8000/api/zlm/hooks/on_flow_report
on_server_started=http://backend:8000/api/zlm/hooks/on_server_started
timeoutSec=10
retry=1
retry_delay=3.0
