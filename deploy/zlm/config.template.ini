# ZLMediaKit 最小配置：
# 输入协议只启用 RTMP，输出能力保留 HTTP-FLV，其他协议关闭以减少干扰。

[api]
apiDebug=0
secret=__ZLM_SECRET__
snapRoot=./www/snap/
defaultSnap=./www/logo.png
downloadRoot=./www

[protocol]
# 关闭 HLS、MP4、RTSP、RTC、SRT 等未使用能力。
# HTTP-FLV 不是单独开关，而是由 HTTP 服务和媒体流按需生成。
modify_stamp=2
enable_audio=1
add_mute_audio=1
auto_close=0
continue_push_ms=15000
paced_sender_ms=0
enable_hls=0
enable_hls_fmp4=0
enable_mp4=0
enable_rtsp=0
enable_rtmp=1
enable_ts=0
enable_fmp4=0
mp4_as_player=0
hls_demand=1
rtsp_demand=1
rtmp_demand=0
ts_demand=1
fmp4_demand=1

[general]
enableVhost=0
maxStreamWaitMS=15000
mergeWriteMS=0
mediaServerId=llvp-zlm
wait_track_ready_ms=10000
listen_ip=::

[hook]
# 后端主动调用 getMediaList 查询状态，因此当前不需要 ZLM 主动回调业务服务器。
enable=0

[http]
# HTTP 服务同时承载两类请求：
# - /index/api/*：FastAPI 查询 ZLM 状态；
# - /live/<stream_id>.live.flv：浏览器拉取 HTTP-FLV 直播流。
charSet=utf-8
keepAliveSecond=30
port=80
sslport=0
rootPath=./www
dirMenu=0
allow_cross_domains=1
allow_ip_range=::1,127.0.0.1,172.16.0.0-172.31.255.255,192.168.0.0-192.168.255.255,10.0.0.0-10.255.255.255

[rtmp]
# RTMP 的 1935 端口是媒体入口，推流地址格式为 rtmp://<host>/<app>/<stream_id>。
handshakeSecond=15
keepAliveSecond=15
port=1935
sslport=0
directProxy=1

[rtsp]
port=0
sslport=0

[rtc]
port=0
tcpPort=0
signalingPort=0
signalingSslPort=0
icePort=0
iceTcpPort=0

[rtp_proxy]
port=0

[srt]
port=0

[shell]
port=0
