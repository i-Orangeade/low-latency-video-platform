# Minimal ZLMediaKit config for RTMP ingest and HTTP-FLV playback.

[api]
apiDebug=0
secret=__ZLM_SECRET__
snapRoot=./www/snap/
defaultSnap=./www/logo.png
downloadRoot=./www

[protocol]
modify_stamp=2
enable_audio=1
add_mute_audio=1
auto_close=0
continue_push_ms=15000
paced_sender_ms=0
enable_hls=0
enable_hls_fmp4=0
enable_mp4=0
enable_rtsp=0
enable_rtmp=1
enable_ts=0
enable_fmp4=0
mp4_as_player=0
hls_demand=1
rtsp_demand=1
rtmp_demand=0
ts_demand=1
fmp4_demand=1

[general]
enableVhost=0
maxStreamWaitMS=15000
mergeWriteMS=0
mediaServerId=llvp-zlm
wait_track_ready_ms=10000
listen_ip=::

[hook]
enable=0

[http]
charSet=utf-8
keepAliveSecond=30
port=80
sslport=0
rootPath=./www
dirMenu=0
allow_cross_domains=1
allow_ip_range=::1,127.0.0.1,172.16.0.0-172.31.255.255,192.168.0.0-192.168.255.255,10.0.0.0-10.255.255.255

[rtmp]
handshakeSecond=15
keepAliveSecond=15
port=1935
sslport=0
directProxy=1

[rtsp]
port=0
sslport=0

[rtc]
port=0
tcpPort=0
signalingPort=0
signalingSslPort=0
icePort=0
iceTcpPort=0

[rtp_proxy]
port=0

[srt]
port=0

[shell]
port=0
