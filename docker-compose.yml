services:
  zlm:
    image: zlmediakit/zlmediakit@sha256:c277aa7fca72e514fe071cc167da994ea5f60e4a39b1519d4939ab63acbe3135
    container_name: llvp-zlm
    restart: unless-stopped
    working_dir: /opt/media/bin
    entrypoint: ["/bin/sh", "/opt/media/bin/llvp-entrypoint.sh"]
    ports:
      - "8080:80"
      - "1935:1935"
    volumes:
      - ./deploy/zlm/entrypoint.sh:/opt/media/bin/llvp-entrypoint.sh:ro
      - ./deploy/zlm/config.template.ini:/opt/media/conf/config.template.ini:ro
      - ./data/zlm/log:/opt/media/bin/log
    environment:
      TZ: Asia/Shanghai
      LLVP_ZLM_SECRET: ${LLVP_ZLM_SECRET:?set LLVP_ZLM_SECRET in .env}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS
          "http://127.0.0.1/index/api/getServerConfig?secret=$${LLVP_ZLM_SECRET}"
          >/dev/null
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: llvp-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      LLVP_ZLM_BASE_URL: http://zlm
      LLVP_ZLM_SECRET: ${LLVP_ZLM_SECRET}
      LLVP_PUBLIC_ZLM_HOST: 127.0.0.1
      LLVP_PUBLIC_ZLM_HTTP_PORT: "8080"
      LLVP_PUBLIC_ZLM_RTMP_PORT: "1935"
      LLVP_DATABASE_URL: sqlite:////app/data/llvp.db
    volumes:
      - ./data/backend:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    container_name: llvp-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
