# 本地容器编排。
# 三个容器分工：
# - zlm：接收 RTMP 推流，向浏览器提供 HTTP-FLV 播放；
# - backend：提供设备管理和流状态 API，不转发实际视频数据；
# - frontend：提供 Vue 页面，并把 /api 请求代理给 backend。
#
# 浏览器的主要访问路径：
# - http://127.0.0.1:5173                  前端页面；
# - http://127.0.0.1:8000/api              后端 API，也可通过前端 /api 代理访问；
# - http://127.0.0.1:8080/live/<id>.live.flv  HTTP-FLV 媒体出口。
# - rtmp://127.0.0.1:1935/live/<id>          RTMP 媒体入口。
services:
  zlm:
    image: zlmediakit/zlmediakit@sha256:c277aa7fca72e514fe071cc167da994ea5f60e4a39b1519d4939ab63acbe3135
    container_name: llvp-zlm
    restart: unless-stopped
    working_dir: /opt/media/bin
    entrypoint: ["/bin/sh", "/opt/media/bin/llvp-entrypoint.sh"]
    # 8080 是宿主机播放端口，映射到容器内 ZLM 的 HTTP 80 端口；
    # 1935 保持同名端口，是 FFmpeg/OBS 等推流客户端的 RTMP 入口。
    ports:
      - "8080:80"
      - "1935:1935"
    volumes:
      - ./deploy/zlm/entrypoint.sh:/opt/media/bin/llvp-entrypoint.sh:ro
      - ./deploy/zlm/config.template.ini:/opt/media/conf/config.template.ini:ro
      - ./data/zlm/log:/opt/media/bin/log
    environment:
      TZ: Asia/Shanghai
      LLVP_ZLM_SECRET: ${LLVP_ZLM_SECRET:?set LLVP_ZLM_SECRET in .env}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS
          "http://127.0.0.1/index/api/getServerConfig?secret=$${LLVP_ZLM_SECRET}"
          >/dev/null
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: llvp-backend
    restart: unless-stopped
    depends_on:
      # 后端启动时会执行 Alembic 迁移并连接 ZLM 查询状态；
      # 等 ZLM API 健康后再启动，可以减少端到端验证初期的 503 抖动。
      zlm:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      # backend 容器内部通过 Docker DNS 名称 zlm 访问 ZLM API。
      # 但返回给浏览器的 URL 必须使用宿主机 127.0.0.1，因为浏览器无法解析容器名 zlm。
      LLVP_ZLM_BASE_URL: http://zlm
      LLVP_ZLM_SECRET: ${LLVP_ZLM_SECRET}
      LLVP_PUBLIC_ZLM_HOST: 127.0.0.1
      LLVP_PUBLIC_ZLM_HTTP_PORT: "8080"
      LLVP_PUBLIC_ZLM_RTMP_PORT: "1935"
      LLVP_DATABASE_URL: sqlite:////app/data/llvp.db
    volumes:
      - ./data/backend:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    container_name: llvp-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      # 等后端健康检查通过后再启动前端，避免首屏请求 API 时连接失败。
      backend:
        condition: service_healthy
